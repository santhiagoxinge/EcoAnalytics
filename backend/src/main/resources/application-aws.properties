# Perfil del despliegue académico en AWS. Los secretos son obligatorios y externos.
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.uri=${MONGODB_URI}
ecoanalytics.jwt.secret=${JWT_SECRET}
ecoanalytics.jwt.validity-hours=2
ecoanalytics.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
