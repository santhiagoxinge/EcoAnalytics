spring.application.name=EcoAnalytics
server.port=8080

# MongoDB local (servicio de Windows en el puerto 27017). Se puede cambiar con la variable MONGODB_URI.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecoanalytics}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecoanalytics}
# Crea los índices declarados con @Indexed y @CompoundIndex al iniciar.
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

ecoanalytics.jwt.secret=${JWT_SECRET:ecoanalytics-dev-secret-change-me-in-production-2026}
ecoanalytics.jwt.validity-hours=12
ecoanalytics.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
# Días de histórico horario sintético que se generan la primera vez que la base está vacía.
ecoanalytics.seed.history-days=430
